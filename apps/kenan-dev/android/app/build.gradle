apply plugin: 'com.android.application'

Properties remote = new Properties()
File remoteFile = rootProject.file('../../remote/android/local.properties')
if (remoteFile.exists()) remoteFile.withInputStream { remote.load(it) }
def localUrl = remote.getProperty('piRemoteLocalUrl', remote.getProperty('piRemoteUrl', 'http://127.0.0.1:8788'))
def convergeAuth = remote.getProperty('piRemoteConvergeAuth', 'direct')
def convergeUrl = remote.getProperty('piRemoteConvergeUrl', 'http://127.0.0.1:8789')
def convergeSshHost = remote.getProperty('piRemoteConvergeSshHost', '')
def convergeSshPort = remote.getProperty('piRemoteConvergeSshPort', '22')
def convergeSshUser = remote.getProperty('piRemoteConvergeSshUser', '')
def convergeSshHostKey = remote.getProperty('piRemoteConvergeSshHostKey', '')
// The development package can run beside the current native client, so its
// loopback listener must not compete for that client's SSH forwarding port.
def convergeSshLocalPort = remote.getProperty('piRemoteKenanDevConvergeSshLocalPort', '18789')
def convergeSshRemoteHost = remote.getProperty('piRemoteConvergeSshRemoteHost', '127.0.0.1')
def convergeSshRemotePort = remote.getProperty('piRemoteConvergeSshRemotePort', '8788')
def convergeSshPrivateKey = ''
if (convergeAuth.equalsIgnoreCase('ssh')) {
    def keySetting = remote.getProperty('piRemoteConvergeSshPrivateKeyFile', '')
    if (keySetting.isBlank()) throw new GradleException('piRemoteConvergeSshPrivateKeyFile is required for SSH authentication')
    File keyFile = new File(keySetting)
    if (!keyFile.isAbsolute()) keyFile = remoteFile.parentFile.toPath().resolve(keySetting).normalize().toFile()
    if (!keyFile.isFile()) throw new GradleException('Pi Remote Converge SSH private key file does not exist')
    convergeSshPrivateKey = Base64.encoder.encodeToString(keyFile.bytes)
}
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace = "works.kenan.piremote.kenan.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId "works.kenan.piremote.kenan.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "0.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "LOCAL_SERVER_URL", javaString(localUrl)
        buildConfigField "String", "CONVERGE_SERVER_URL", javaString(convergeUrl)
        buildConfigField "String", "CONVERGE_AUTH", javaString(convergeAuth)
        buildConfigField "String", "CONVERGE_SSH_HOST", javaString(convergeSshHost)
        buildConfigField "int", "CONVERGE_SSH_PORT", convergeSshPort
        buildConfigField "String", "CONVERGE_SSH_USER", javaString(convergeSshUser)
        buildConfigField "String", "CONVERGE_SSH_PRIVATE_KEY_BASE64", javaString(convergeSshPrivateKey)
        buildConfigField "String", "CONVERGE_SSH_HOST_KEY", javaString(convergeSshHostKey)
        buildConfigField "int", "CONVERGE_SSH_LOCAL_PORT", convergeSshLocalPort
        buildConfigField "String", "CONVERGE_SSH_REMOTE_HOST", javaString(convergeSshRemoteHost)
        buildConfigField "int", "CONVERGE_SSH_REMOTE_PORT", convergeSshRemotePort
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.github.mwiede:jsch:2.28.7"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
