<!doctype html>
<meta charset="utf-8">
<title>Pi telephone media</title>
<p id="status">Connecting</p>
<script type="module">
import { RetellClient, RoomEvent, Track } from '/media/retell-sdk.js';

const status = document.getElementById('status');
const token = decodeURIComponent(location.hash.slice(1));
history.replaceState(null, '', location.pathname + location.search);
const abort = new AbortController();
const pendingEvents = [];
const incoming = new Map();
let socket, audio, destination, inputGate, renderSink, peer, channel, monitor, room;
let gptStream, gptPlayback, grant, restoreCapture, startupTimer, proofFrame, outputSource, outputAnalyser;
let closed = false, started = false, takenOver = false, ready = false, preflight = false, transportCallId, pendingBytes = 0;
const diagnostics = { phase: 'connecting', remoteTrack: 'none', captureRequests: 0 };
window.telephoneMediaDiagnostics = () => ({ ...diagnostics, audioState: audio?.state || 'none', connectionState: peer?.connectionState || 'none', retellState: monitor?.status || 'none', incomingTracks: incoming.size, takenOver, ready });

function send(message) {
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
}
function close() {
  if (closed) return;
  closed = true;
  diagnostics.phase = 'closed';
  abort.abort();
  clearTimeout(startupTimer);
  cancelAnimationFrame(proofFrame);
  restoreCapture?.();
  if (channel?.readyState === 'open' && started) channel.send(JSON.stringify({ type: 'session.close', event_id: crypto.randomUUID() }));
  channel?.close();
  peer?.close();
  room?.off(RoomEvent.TrackSubscribed, attachIncoming);
  room?.off(RoomEvent.TrackUnsubscribed, detachIncoming);
  monitor?.disconnect();
  for (const entry of incoming.values()) entry.source.disconnect();
  incoming.clear();
  inputGate?.disconnect();
  outputSource?.disconnect();
  outputAnalyser?.disconnect();
  renderSink?.disconnect();
  if (gptPlayback) { gptPlayback.pause(); gptPlayback.srcObject = null; }
  for (const track of destination?.stream.getTracks() || []) track.stop();
  if (audio && audio.state !== 'closed') void audio.close().catch(error => { status.textContent = 'Audio cleanup error: ' + String(error); });
  socket?.close();
  pendingEvents.length = pendingBytes = 0;
  status.textContent = 'Closed';
}
function fail(error) {
  if (closed) return;
  const message = String(error?.message || error);
  send({ type: 'error', error: message });
  close();
  diagnostics.phase = 'failed';
  status.textContent = 'Error: ' + message;
}
function ensureOpen() {
  if (closed) throw new Error('Telephone media closed during startup');
}
function sendLive(event) {
  const payload = JSON.stringify(event);
  if (started && (takenOver || preflight) && channel?.readyState === 'open') channel.send(payload);
  else {
    if (pendingEvents.length >= 64 || pendingBytes + payload.length > 128 * 1024) throw new Error('Live event queue overflow');
    pendingEvents.push(payload);
    pendingBytes += payload.length;
  }
}
function flushLive() {
  for (const payload of pendingEvents.splice(0)) channel.send(payload);
  pendingBytes = 0;
}
function announceReady() {
  if (closed || ready || !started || !gptStream) return;
  ready = true;
  clearTimeout(startupTimer);
  diagnostics.phase = 'voice-ready';
  send({ type: 'ready' });
  status.textContent = 'Voice ready; waiting for telephone';
}
function observeOutput() {
  if (closed) return;
  const samples = new Float32Array(outputAnalyser.fftSize);
  outputAnalyser.getFloatTimeDomainData(samples);
  const peak = samples.reduce((maximum, sample) => Math.max(maximum, Math.abs(sample)), 0);
  diagnostics.outputPeak = peak;
  if ((preflight || takenOver) && peak > 0.01) {
    send({ type: 'audio-proof', bytes: samples.byteLength });
    return;
  }
  proofFrame = requestAnimationFrame(observeOutput);
}
async function request(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body), signal: abort.signal,
  });
  ensureOpen();
  if (!response.ok) throw new Error(path + ' failed (' + response.status + ')');
  return response;
}
function validateGrant(value) {
  if (!value || typeof value.callId !== 'string' || !value.callId || typeof value.accessToken !== 'string' || !value.accessToken || typeof value.participantId !== 'string' || !value.participantId || value.transport !== 'livekit' || typeof value.url !== 'string') throw new Error('Invalid Retell monitor grant');
  const url = new URL(value.url);
  if (url.protocol !== 'wss:') throw new Error('Retell transport must be secure WebRTC signaling');
  if (value.iceServers !== undefined && !Array.isArray(value.iceServers)) throw new Error('Invalid Retell ICE servers');
  return value;
}
function attachIncoming(track, publication) {
  if (closed || track.kind !== Track.Kind.Audio || publication.trackName === 'agent_audio' || incoming.has(track.sid)) return;
  if (!track.mediaStreamTrack || track.mediaStreamTrack.readyState !== 'live') { fail(new Error('Retell incoming track is not live')); return; }
  track.setVolume(0);
  const source = audio.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
  source.connect(inputGate);
  incoming.set(track.sid, { source });
}
function detachIncoming(track) {
  const entry = incoming.get(track.sid);
  if (!entry) return;
  entry.source.disconnect();
  incoming.delete(track.sid);
}
function waitFor(predicate, target, event, message) {
  if (predicate()) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const cleanup = () => {
      clearTimeout(timer);
      if (target?.removeEventListener) target.removeEventListener(event, changed);
      else target?.off(event, changed);
      abort.signal.removeEventListener('abort', cancelled);
    };
    const changed = () => { if (predicate()) { cleanup(); resolve(); } };
    const cancelled = () => { cleanup(); reject(new Error(message + ' cancelled')); };
    const timer = setTimeout(() => { cleanup(); reject(new Error(message + ' timed out')); }, 10000);
    if (target?.addEventListener) target.addEventListener(event, changed);
    else target?.on(event, changed);
    abort.signal.addEventListener('abort', cancelled, { once: true });
    if (abort.signal.aborted) cancelled();
    else changed();
  });
}
async function connectLive() {
  peer = new RTCPeerConnection();
  for (const track of destination.stream.getAudioTracks()) {
    track.contentHint = 'speech';
    peer.addTrack(track, destination.stream);
  }
  peer.ontrack = ({ track }) => {
    if (closed || track.kind !== 'audio') return;
    if (gptStream) { fail(new Error('GPT Live returned multiple audio tracks')); return; }
    diagnostics.remoteTrack = track.readyState;
    gptStream = new MediaStream([track]);
    // Chromium needs a playing media element to pull WebRTC receive audio. It is never audible locally.
    gptPlayback = new Audio();
    gptPlayback.volume = 0;
    gptPlayback.srcObject = gptStream;
    void gptPlayback.play().catch(fail);
    outputSource = audio.createMediaStreamSource(gptStream);
    outputAnalyser = audio.createAnalyser();
    outputSource.connect(outputAnalyser);
    outputAnalyser.connect(renderSink);
    proofFrame = requestAnimationFrame(observeOutput);
    track.onended = () => fail(new Error('GPT Live audio track ended'));
    announceReady();
  };
  peer.onconnectionstatechange = () => {
    if (['failed', 'disconnected', 'closed'].includes(peer.connectionState)) fail(new Error('GPT Live WebRTC ' + peer.connectionState));
  };
  channel = peer.createDataChannel('oai-events');
  channel.onclose = () => fail(new Error('GPT Live event channel closed'));
  channel.onerror = () => fail(new Error('GPT Live event channel failed'));
  channel.onmessage = ({ data }) => {
    try {
      const event = JSON.parse(data);
      if (!event || typeof event.type !== 'string') throw new Error('Invalid GPT Live event');
      send({ type: 'live-event', event });
      if (event.type === 'session.started') { started = true; announceReady(); }
      else if (event.type === 'error') fail(new Error(event.error?.message || 'GPT Live protocol error'));
      else if (event.type === 'session.closed') close();
    } catch (error) { fail(error); }
  };
  await peer.setLocalDescription(await peer.createOffer());
  ensureOpen();
  await waitFor(() => peer.iceGatheringState === 'complete', peer, 'icegatheringstatechange', 'GPT Live ICE gathering');
  const response = await request('/media/offer', { sdp: peer.localDescription.sdp });
  const connection = await response.json();
  ensureOpen();
  if (!connection.session?.id || !connection.transport?.sdp) throw new Error('GPT Live offer returned no session or SDP');
  await peer.setRemoteDescription({ type: 'answer', sdp: connection.transport.sdp });
  await waitFor(() => gptStream?.getAudioTracks()[0]?.readyState === 'live', peer, 'track', 'GPT Live remote audio');
}
async function sdkFetch(input, options) {
  ensureOpen();
  const path = new URL(String(input)).pathname;
  if (options?.method !== 'POST') throw new Error('Unsupported Retell control method');
  if (path === '/v2/listen-live-call/' + encodeURIComponent(grant.callId)) {
    return Response.json({ access_token: grant.accessToken, participant_id: grant.participantId, url: grant.url, transport: grant.transport, ice_servers: grant.iceServers });
  }
  if (path === '/v2/take-over-live-call/' + encodeURIComponent(grant.callId)) {
    const body = JSON.parse(options.body);
    if (body.participant_id !== grant.participantId || Object.keys(body).length !== 1) throw new Error('Retell takeover participant mismatch');
    return request('/media/takeover', { callId: grant.callId, participantId: grant.participantId });
  }
  throw new Error('Unsupported Retell control route');
}
async function takeOver() {
  const devices = navigator.mediaDevices;
  if (!devices || typeof devices.getUserMedia !== 'function') throw new Error('WebRTC capture API unavailable');
  const descriptor = Object.getOwnPropertyDescriptor(devices, 'getUserMedia');
  const capture = async constraints => {
    ensureOpen();
    if (!constraints?.audio || constraints.video) throw new Error('Unexpected capture request during Retell takeover');
    const track = gptStream?.getAudioTracks()[0];
    if (track?.readyState !== 'live') throw new Error('GPT Live output is not available for Retell takeover');
    diagnostics.captureRequests++;
    return new MediaStream([track.clone()]);
  };
  // SDK 3.0.2 has no custom capture input. Both its disposable probe and published mic get independent GPT track clones.
  Object.defineProperty(devices, 'getUserMedia', { configurable: true, writable: true, value: capture });
  restoreCapture = () => {
    if (devices.getUserMedia !== capture) return;
    if (descriptor) Object.defineProperty(devices, 'getUserMedia', descriptor);
    else delete devices.getUserMedia;
    restoreCapture = undefined;
  };
  try { await monitor.takeOver(); }
  finally { restoreCapture?.(); }
  ensureOpen();
  if (monitor.status !== 'taken_over') throw new Error('Retell takeover did not publish audio');
  takenOver = true;
  inputGate.gain.value = 1;
  diagnostics.phase = 'taken_over';
  clearTimeout(startupTimer);
  send({ type: 'transport-ready', callId: grant.callId, participantId: grant.participantId });
  flushLive();
  status.textContent = 'Connected';
}
async function connectTransport(callId) {
  if (!ready || preflight || transportCallId) throw new Error('Telephone transport is not available in this state');
  transportCallId = callId;
  startupTimer = setTimeout(() => fail(new Error('Retell takeover startup timed out')), 20000);
  grant = validateGrant(await (await request('/media/transport', {})).json());
  ensureOpen();
  if (grant.callId !== callId) throw new Error('Retell call identity mismatch');
  const client = new RetellClient({ key: token, baseURL: location.origin, fetch: sdkFetch });
  monitor = client.monitorCall({ call_id: grant.callId, transcript: false, hooks: { onError: fail, onEnd: close } });
  await monitor.ready;
  await monitor.listen();
  ensureOpen();
  // Pinned SDK 3.0.2 does not expose incoming tracks. The same LiveKit room owns subscriptions and teardown.
  room = monitor.transport?.room;
  if (!room?.remoteParticipants || typeof room.on !== 'function') throw new Error('Retell SDK LiveKit room unavailable');
  room.on(RoomEvent.TrackSubscribed, attachIncoming);
  room.on(RoomEvent.TrackUnsubscribed, detachIncoming);
  for (const participant of room.remoteParticipants.values()) {
    for (const publication of participant.trackPublications.values()) if (publication.track) attachIncoming(publication.track, publication);
  }
  diagnostics.phase = 'listening';
  await waitFor(() => incoming.size > 0, room, RoomEvent.TrackSubscribed, 'Retell caller audio');
  await takeOver();
}
async function start() {
  if (!token) throw new Error('Missing telephone media token');
  startupTimer = setTimeout(() => fail(new Error('Telephone WebRTC startup timed out')), 40000);
  audio = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  destination = audio.createMediaStreamDestination();
  inputGate = audio.createGain();
  inputGate.gain.value = 0;
  inputGate.connect(destination);
  renderSink = audio.createGain();
  renderSink.gain.value = 0;
  inputGate.connect(renderSink);
  renderSink.connect(audio.destination);
  await audio.resume();
  ensureOpen();
  if (audio.state !== 'running') throw new Error('Chromium must permit autoplay for telephone media');
  audio.onstatechange = () => { if (!closed && audio.state === 'suspended') fail(new Error('Telephone AudioContext suspended')); };
  const url = new URL('/browser-media', location.href);
  url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  socket = new WebSocket(url);
  socket.onopen = () => { send({ type: 'authenticate', token }); void connectLive().catch(fail); };
  socket.onmessage = ({ data }) => {
    try {
      if (typeof data !== 'string') throw new Error('Binary telephone media is not supported');
      const message = JSON.parse(data);
      if (message.type === 'context' && typeof message.text === 'string') {
        sendLive({ type: 'session.commentary.append', event_id: crypto.randomUUID(), delegation_id: null, content: message.text });
      } else if (message.type === 'live-event' && typeof message.event?.type === 'string') sendLive(message.event);
      else if (message.type === 'transport' && typeof message.callId === 'string' && message.callId) void connectTransport(message.callId).catch(fail);
      else if (message.type === 'preflight' && typeof message.text === 'string' && message.text.trim()) {
        if (!ready || preflight || transportCallId) throw new Error('Audio preflight is not available in this state');
        preflight = true;
        diagnostics.phase = 'preflight';
        flushLive();
        sendLive({ type: 'session.commentary.append', event_id: crypto.randomUUID(), delegation_id: null, content: message.text });
      }
      else if (message.type === 'close') close();
      else if (message.type === 'error') fail(new Error(String(message.error || 'Telephone service error')));
      else throw new Error('Unsupported telephone control message');
    } catch (error) { fail(error); }
  };
  socket.onerror = () => fail(new Error('Telephone media websocket failed'));
  socket.onclose = () => { if (!closed) fail(new Error('Telephone media websocket closed')); };
}
window.addEventListener('pagehide', close);
void start().catch(fail);
</script>
