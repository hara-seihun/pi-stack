<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Pi Remote Voice</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; background:#0b0d10; color:#f1f4f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
    main { width:min(420px,100%); text-align:center; display:grid; gap:24px; }
    h1 { font-size:22px; margin:0; }
    #status { color:#8b949e; min-height:24px; }
    #orb { width:156px; height:156px; margin:auto; border-radius:50%; border:2px solid #30363d; background:#16191e; display:grid; place-items:center; transition:.2s; }
    #orb.live { border-color:#89b4fa; box-shadow:0 0 42px #89b4fa44; }
    #orb.error { border-color:#ff7b72; }
    #orb svg { width:62px; fill:none; stroke:#f1f4f8; stroke-width:1.8; stroke-linecap:round; }
    #start { height:54px; border:0; border-radius:14px; background:#89b4fa; color:#0b0d10; font-size:17px; font-weight:700; }
    #controls { display:flex; justify-content:center; gap:14px; }
    #controls button { min-width:104px; height:48px; border:1px solid #30363d; border-radius:12px; background:#1f232a; color:#f1f4f8; font-weight:650; }
    #hangup { color:#ff7b72!important; }
    [hidden] { display:none!important; }
  </style>
  <script type="module" src="/src/voice-page.ts"></script>
</head>
<body>
  <main>
    <h1 id="title">Pi Remote Voice</h1>
    <div id="orb" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-3 0h6"/></svg></div>
    <div id="status">Ready to connect</div>
    <button id="start" type="button">Start voice</button>
    <div id="controls" hidden>
      <button id="mute" type="button">Mute</button>
      <button id="hush" type="button">Stop talking</button>
      <button id="hangup" type="button">Hang up</button>
    </div>
  </main>
</body>
</html>
