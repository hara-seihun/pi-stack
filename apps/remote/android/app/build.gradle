plugins {
    id "com.android.application"
}

Properties local = new Properties()
File localFile = rootProject.file("local.properties")
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def localUrl = local.getProperty("piRemoteLocalUrl", local.getProperty("piRemoteUrl", "http://127.0.0.1:8788"))
def convergeUrl = local.getProperty("piRemoteConvergeUrl", "http://127.0.0.1:8789")
def convergeAuth = local.getProperty("piRemoteConvergeAuth", "direct")
def convergeSshHost = local.getProperty("piRemoteConvergeSshHost", "")
def convergeSshPort = local.getProperty("piRemoteConvergeSshPort", "22")
def convergeSshUser = local.getProperty("piRemoteConvergeSshUser", "")
def convergeSshPrivateKeyFile = local.getProperty("piRemoteConvergeSshPrivateKeyFile", "")
def convergeSshPrivateKey = ""
if (convergeAuth.equalsIgnoreCase("ssh")) {
    if (convergeSshPrivateKeyFile.isBlank())
        throw new GradleException("piRemoteConvergeSshPrivateKeyFile is required for SSH authentication")
    File privateKey = new File(convergeSshPrivateKeyFile)
    if (!privateKey.isAbsolute()) privateKey = rootProject.file(convergeSshPrivateKeyFile)
    if (!privateKey.isFile())
        throw new GradleException("Pi Remote Converge SSH private key file does not exist")
    convergeSshPrivateKey = Base64.encoder.encodeToString(privateKey.bytes)
}
def convergeSshHostKey = local.getProperty("piRemoteConvergeSshHostKey", "")
def convergeSshLocalPort = local.getProperty("piRemoteConvergeSshLocalPort", "8789")
def convergeSshRemoteHost = local.getProperty("piRemoteConvergeSshRemoteHost", "127.0.0.1")
def convergeSshRemotePort = local.getProperty("piRemoteConvergeSshRemotePort", "8788")
def remoteApplicationId = local.getProperty("piRemoteApplicationId", "dev.piremote")
def remoteAppLabel = local.getProperty("piRemoteAppLabel", "Pi Remote")
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace "dev.piremote"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId remoteApplicationId
        manifestPlaceholders = [piRemoteAppLabel: remoteAppLabel]
        minSdk 26
        targetSdk 36
        versionCode 85
        versionName "0.55.1"
        buildConfigField "String", "LOCAL_SERVER_URL", javaString(localUrl)
        buildConfigField "String", "CONVERGE_SERVER_URL", javaString(convergeUrl)
        buildConfigField "String", "CONVERGE_AUTH", javaString(convergeAuth)
        buildConfigField "String", "CONVERGE_SSH_HOST", javaString(convergeSshHost)
        buildConfigField "int", "CONVERGE_SSH_PORT", convergeSshPort
        buildConfigField "String", "CONVERGE_SSH_USER", javaString(convergeSshUser)
        buildConfigField "String", "CONVERGE_SSH_PRIVATE_KEY_BASE64", javaString(convergeSshPrivateKey)
        buildConfigField "String", "CONVERGE_SSH_HOST_KEY", javaString(convergeSshHostKey)
        buildConfigField "int", "CONVERGE_SSH_LOCAL_PORT", convergeSshLocalPort
        buildConfigField "String", "CONVERGE_SSH_REMOTE_HOST", javaString(convergeSshRemoteHost)
        buildConfigField "int", "CONVERGE_SSH_REMOTE_PORT", convergeSshRemotePort
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:ext-latex:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:ext-tasklist:4.6.2"
    implementation "io.noties.markwon:image-glide:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
    implementation "com.github.mwiede:jsch:2.28.7"
    testImplementation "junit:junit:4.13.2"
}
