import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

Properties remote = new Properties()
File remoteFile = rootProject.file('local.properties')
if (remoteFile.exists()) remoteFile.withInputStream { remote.load(it) }
// Endpoints the app can reach, one JSON list. A direct endpoint is a URL; an
// SSH endpoint names a restricted forwarding identity whose private key file
// is read here and embedded in the build. Without a declaration the app talks
// to a loopback development server.
def endpointsSetting = remote.getProperty('piRemoteEndpoints', '')
def endpointsFileSetting = remote.getProperty('piRemoteEndpointsFile', '')
def endpoints
if (!endpointsSetting.isBlank()) {
    endpoints = new JsonSlurper().parseText(endpointsSetting)
} else if (!endpointsFileSetting.isBlank()) {
    File endpointsFile = new File(endpointsFileSetting)
    if (!endpointsFile.isAbsolute()) endpointsFile = remoteFile.parentFile.toPath().resolve(endpointsFileSetting).normalize().toFile()
    if (!endpointsFile.isFile()) throw new GradleException("Pi Remote endpoints file does not exist: $endpointsFile")
    endpoints = new JsonSlurper().parse(endpointsFile)
} else {
    endpoints = [[id: 'local', name: 'Local', auth: 'direct', url: 'http://127.0.0.1:8788', requiresUnlock: false]]
}
if (!(endpoints instanceof List) || endpoints.isEmpty()) throw new GradleException('piRemoteEndpoints must be a non-empty JSON list')
endpoints.each { endpoint ->
    if (endpoint.auth == 'ssh') {
        def keySetting = endpoint.ssh?.privateKeyFile ?: ''
        if (keySetting.isBlank()) throw new GradleException("endpoint ${endpoint.id} needs ssh.privateKeyFile")
        File keyFile = new File(keySetting)
        if (!keyFile.isAbsolute()) keyFile = remoteFile.parentFile.toPath().resolve(keySetting).normalize().toFile()
        if (!keyFile.isFile()) throw new GradleException("Pi Remote SSH private key file does not exist for ${endpoint.id}")
        endpoint.ssh.privateKeyBase64 = Base64.encoder.encodeToString(keyFile.bytes)
        endpoint.ssh.remove('privateKeyFile')
    }
}
def endpointsJson = groovy.json.JsonOutput.toJson(endpoints)
def javaString = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def packageConfig = new JsonSlurper().parse(rootProject.file('../package.json'))
def capacitorConfig = new JsonSlurper().parse(rootProject.file('../capacitor.config.json'))
def applicationIdValue = capacitorConfig.appId
def versionNameValue = packageConfig.version

android {
    namespace = applicationIdValue
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId applicationIdValue
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 97
        versionName versionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "ENDPOINTS", javaString(endpointsJson)
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def liveServerUrl = providers.gradleProperty('piRemoteLiveServerUrl').orElse('').get().trim()
if (!liveServerUrl.isEmpty()) {
    def liveUri = new URI(liveServerUrl)
    if (liveUri.scheme != 'https' || !liveUri.host || liveUri.userInfo || liveUri.query || liveUri.fragment) {
        throw new GradleException('piRemoteLiveServerUrl must be an HTTPS frontend URL')
    }
    def liveAssets = layout.buildDirectory.dir('generated/liveClientAssets')
    def generateLiveClientConfig = tasks.register('generateLiveClientConfig') {
        inputs.property('liveServerUrl', liveServerUrl)
        inputs.file('src/main/assets/capacitor.config.json')
        outputs.dir(liveAssets)
        doLast {
            def config = new JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
            config.server = (config.server ?: [:]) + [url: liveServerUrl]
            File target = new File(liveAssets.get().asFile, 'capacitor.config.json')
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.toJson(config)
        }
    }
    android.sourceSets.debug.assets.srcDir(liveAssets)
    tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
        dependsOn(generateLiveClientConfig)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.github.mwiede:jsch:2.28.7"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
