name: test

on:
  push:
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - run: timeout --signal=TERM --kill-after=2s 50s npm run check
