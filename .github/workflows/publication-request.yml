name: publication request

on:
  push:
    branches:
      - 'pi-stack-publication-requests/PUB-*'

permissions:
  contents: read

concurrency:
  group: publication-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: [self-hosted, pi-stack]
    timeout-minutes: 1
    steps:
      - name: Transfer custody to the installed publisher
        env:
          SOURCE_SHA: ${{ github.sha }}
          REQUEST_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export PATH="/run/wrappers/bin:/run/current-system/sw/bin:$PATH"
          [[ "$GITHUB_REPOSITORY" == hara-seihun/pi-stack ]]
          [[ "$REQUEST_REF" == pi-stack-publication-requests/* ]]
          request=${REQUEST_REF#pi-stack-publication-requests/}
          [[ "$request" =~ ^PUB-[a-f0-9]{24}$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          owner=/home/kenan/machine/pi-stack-publication
          id
          uid=$(id -u kenan)
          sudo -n -u kenan -- env HOME=/home/kenan \
            XDG_RUNTIME_DIR="/run/user/$uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            PATH="/home/kenan/.local/bin:/run/wrappers/bin:/run/current-system/sw/bin:/usr/bin:/bin" \
            "$owner" enqueue "$request" "$SOURCE_SHA" "refs/heads/pi-stack-publications/$request" null
